<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar Body -->
  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" fill="rgba(108, 92, 231, 0.1)"></rect>
  <!-- Top Binders -->
  <line x1="16" y1="2" x2="16" y2="6"></line>
  <line x1="8" y1="2" x2="8" y2="6"></line>
  <!-- Header Separator -->
  <line x1="3" y1="10" x2="21" y2="10"></line>
  <!-- Event Marker -->
  <circle cx="12" cy="16" r="3" fill="#e056fd" stroke="none"></circle>
</svg>
