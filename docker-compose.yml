version: '3.8'

services:
  db:
    image: postgres:16
    container_name: eventhub-db
    environment:
      POSTGRES_USER: eventhub_user
      POSTGRES_PASSWORD: eventhub_password
      POSTGRES_DB: eventhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
